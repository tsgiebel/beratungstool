und:#eef1f7;border-radius:99px;padding:4px 10px;font-size:.85rem}.result-section{margin:28px 0}.sorted-cards{margin:18px 0 24px}.sorted-cards>summary{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:14px;color:#24304a}.sorted-cards[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}.sorted-cards-content{padding:2px 20px 14px;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;background:#fff}.highlight{border-left:5px solid var(--primary)}.forms{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.textarea-wrap{display:block}.textarea-wrap label{font-weight:750;display:block;margin-bottom:8px}textarea{width:100%;min-height:190px;border:1px solid #d9deea;border-radius:14px;padding:14px;resize:vertical;background:#fff}.export-note{padding:14px;background:#f0faf3;border-radius:12px;color:#176b37;margin-top:18px}.priority-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.dropzone{min-height:140px;border:2px dashed #cbd2e1;border-radius:16px;padding:15px;background:#fafbfe}.dropzone.exclude{background:#fff8f5;border-color:#e8c9bc}.dropzone.over{background:#eef4ff;border-color:var(--primary)}.drag-card{background:#fff;border:1px solid #dfe4ed;border-radius:12px;padding:12px;margin:8px 0;cursor:grab;display:flex;align-items:center;gap:8px;transition:opacity .15s}.drag-card.dragging{opacity:.35}.drag-card .grip{color:#b7bdc9;font-weight:800;letter-spacing:1px;cursor:grab;padding:0 2px}.drag-card .card-main{flex:1;min-width:0}.reorder-btns{display:flex;flex-direction:column;gap:4px}.icon-btn{background:#eef1f7;color:#24304a;border-radius:8px;width:28px;height:28px;min-height:0;padding:0;font-weight:800;line-height:1;cursor:pointer}.icon-btn:disabled{opacity:.35;cursor:not-allowed}.drag-placeholder{border:2px dashed var(--primary);border-radius:12px;background:#eef1ff;margin:8px 0;height:52px}.result.dir-left{border-left:4px solid #a32626}.result.dir-right{border-left:4px solid #176b37}.dir-badge{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 9px;border-radius:99px;margin-right:8px;vertical-align:middle}.dir-badge.dir-left{background:#fff0f0;color:#8b2727}.dir-badge.dir-right{background:#eef9f1;color:#176b37}.rank{display:inline-flex;width:27px;height:27px;border-radius:50%;background:#eef1f7;align-items:center;justify-content:center;margin-right:8px;font-size:.85rem;font-weight:700}.session-status{font-size:.86rem;color:var(--muted)}@media(max-width:700px){.topbar{padding:10px 15px}.brand-text{display:none}.container{padding:25px 15px 60px}.forms,.priority-layout{grid-template-columns:1fr}.swipe-card{min-height:500px;padding:26px 20px}.swipe-help{grid-template-columns:1fr}.footer .button,.actions .button{flex:1}.panel{padding:20px}}@media print{.topbar,.no-print{display:none!important}.container{padding:0;max-width:none}.panel{box-shadow:none;border:0;padding:0}.forms{display:block}.textarea-wrap{margin-top:25px}textarea{border:1px solid #999}.sorted-cards{display:block!important}.sorted-cards-content{display:block!important;border:0;padding:0}.sorted-cards>summary{display:none}}

<script>
'use strict';
const categories=['Schulisches Zukunftsbild','Persönlichkeitsentwicklung und Lebenswelt der Schüler:innen','Gestaltung schulischer Lehr-/Lernprozesse','Veränderte Rollen und kontinuierliche Professionalisierung von Lehrkräften','Einbezug digitaler Ausstattung'];
const cards=[
{id:'EF1-1',cat:0,title:'Partizipative Entwicklung unseres Zukunftsbildes',desc:'Wir formulieren ein gemeinsames, realistisches, aber mutiges Bild davon, wie Lernen in unserer Schule in 3–5 Jahren mit digitalen Medien aussieht.',qs:['Wie sieht ein „gelungener Lerntag“ mit digitalen Medien für unsere Schüler:innen mit Unterstützungsbedarf konkret aus?','Welche Rolle spielen Beziehung, Struktur und Sicherheit in digitalen Lernsettings?','Wer muss an der Entwicklung des Zukunftsbildes beteiligt sein (Lehrkräfte, Fachkräfte, Schulbegleitungen, Therapeut:innen, Eltern, Schüler:innen)?']},
{id:'EF1-2',cat:0,title:'Gemeinsame Prozessgestaltung',desc:'Digitalisierung ist kein Projekt einzelner Engagierter, sondern Teil der gesamten Schulentwicklung.',qs:['Welche bestehenden Gremien (Steuergruppe, Lehrerkonferenz, Teilkonferenzen) können Verantwortung übernehmen?','Wie sorgen wir dafür, dass das Gesamtkollegium und auch skeptische Kolleg:innen gehört und mitgenommen werden?','Was brauchen wir, damit Entscheidungen zur Digitalisierung verbindlich und transparent sind?']},
{id:'EF1-3',cat:0,title:'Schulprogramm und Medienkonzept als lebendige Dokumente',desc:'Unser Schulprogramm und Medienkonzept beschreiben unser Zukunftsbild und werden regelmäßig angepasst.',qs:['Wo steht unser Medienkonzept heute (auf dem aktuellsten Stand, in Überarbeitung, noch in Planung)?','Wie verknüpfen wir das Medienkonzept mit dem Schulprogramm und Förderkonzepten (z.B. Kommunikationsförderung, soziale/emotionale Entwicklung)?','Wie planen wir eine regelmäßige Überprüfung und Fortschreibung (z.B. alle 2 Jahre)?','Wie können wir das Medienkonzept so integrieren, dass es im Alltag hilfreich und leicht umzusetzen ist?']},
{id:'EF1-4',cat:0,title:'Vernetzung der Schule',desc:'Wir denken die Vernetzung unserer Schule nach innen (Kollegium, weitere Professionen) und nach außen (Schulträger, außerschulische Partner, Eltern) systematisch mit – analog und digital.',qs:['Mit welchen Partnern arbeiten wir bereits digital zusammen (z.B. Schulträger, Lernorte, Jugendhilfe, Therapie, Werkstätten, Beratungsstellen)?','Wo fehlt uns bisher eine gute digitale Vernetzung – und was würde sie konkret erleichtern?','Wie können wir Kommunikationswege (Mail, Messenger, Plattformen) klar und strukturiert gestalten, sodass niemand „verloren geht“?']},
{id:'EF1-5',cat:0,title:'Vereinbarung von Lern- und Unterrichtsprinzipien',desc:'Wir entwickeln gemeinsame, verbindliche Prinzipien für Lernen und Unterricht mit digitalen Medien, die zu unserer Schule passen.',qs:['Welche Grundsätze sollen für alle Lerngruppen gelten (z.B. Struktur, Verlässlichkeit, Förderung von Selbstwirksamkeit, Anknüpfen an Stärken)?','Wie legen wir gemeinsam fest, wie digitale Medien eingesetzt werden (z.B. nicht nur als Belohnung, sondern zur Unterstützung von Lernprozessen)?','Wie machen wir diese vereinbarten Prinzipien im Kollegium und für neue Kolleg:innen transparent?']},
{id:'EF1-6',cat:0,title:'Weiterentwicklung des Lernens in den Fächern und Förderbereichen',desc:'Digitale Medien werden gezielt eingesetzt, um das Lernen in Fächern und Förderbereichen (z.B. Sprache, Motorik, Wahrnehmung, soziale/emotionale Entwicklung) weiterzuentwickeln.',qs:['In welchen Fächern (und Förderbereichen) nutzen wir digitale Medien bereits regelmäßig – und mit welchem Mehrwert?','Wo sehen wir besondere Potenziale für digitale Unterstützung (z.B. individuelle Förderung, Unterstützte Kommunikation, Leseförderung, Unterstützung bei LRS)?','Wie können wir gute Beispiele aus einzelnen Klassen in die gesamte Schule tragen und verstetigen?']},
{id:'EF1-7',cat:0,title:'Schaffung erweiterter Lernräume',desc:'Wir nutzen digitale Möglichkeiten, um Lernräume über das Klassenzimmer hinaus zu öffnen – in der Schule, im Sozialraum und in der digitalen Welt.',qs:['Welche erweiterten Lernräume (z.B. Schulhof, Werkstatt, Stadtteil, Betriebe, digitale Ausstellungen) nutzen wir bereits – mit oder ohne digitale Unterstützung?','Wie können digitale Medien helfen, diese Lernräume barriereärmer und zugänglicher für unsere Schüler:innen zu machen?','Welche organisatorischen und technischen Voraussetzungen brauchen wir, um solche erweiterten Lernräume regelmäßig zu nutzen?']},
{id:'EF2-1',cat:1,title:'Digitale Lebenswelten unserer Schüler:innen verstehen',desc:'Wir knüpfen an digitale Erfahrungen, Interessen und Lernvoraussetzungen unserer Schüler:innen an.',qs:['Welche Geräte, Apps und Spiele nutzen unsere Schüler:innen privat?','Welche Chancen und Risiken sehen wir darin (z.B. Cybermobbing, In-App-Käufe, Überforderung) und wie greifen wir diese pädagogisch auf?','Wie können wir die digitale Lebenswelt der Schüler:innen produktiv für Lern- und Förderprozesse aufgreifen?']},
{id:'EF2-2',cat:1,title:'Partizipation durch (Mit-)Verantwortung stärken',desc:'Digitale Medien helfen, Selbstwirksamkeit zu erleben und Teilhabe zu ermöglichen (z.B. Unterstützte Kommunikation, einfache Präsentationsformen).',qs:['Wo können Tablets, Talker, Symbolsysteme oder Bildkarten digitale Unterstützung bieten?','Wie können Schüler:innen ihre Lernprodukte (z.B. Fotos, Audio, kurze Videos) zeigen und präsentieren?','Welche Schüler:innen profitieren besonders von assistiven Technologien – und wie stellen wir deren Einsatz dauerhaft sicher?']},
{id:'EF2-3',cat:1,title:'Mitdenken von Chancengerechtigkeit',desc:'Entscheidungen zur Digitalisierung werden unter dem Blickwinkel von Chancengerechtigkeit und Teilhabe getroffen – besonders für Schüler:innen mit Unterstützungsbedarfen.',qs:['Wer profitiert derzeit am meisten von digitalen Angeboten an unserer Schule – und wer fällt (noch) durch das Raster?','Welche Barrieren (z.B. Sprache, Motorik, Wahrnehmung, häusliche Ausstattung) müssen wir gezielt ausgleichen?','Wie berücksichtigen wir diese Perspektive verbindlich bei Beschaffung, Unterrichtsplanung und Fortbildung?']},
{id:'EF2-4',cat:1,title:'Förderung demokratischer Teilhabe',desc:'Wir nutzen digitale Medien, um demokratische Prozesse (Mitbestimmung, Wahlen, Meinungsäußerung) für unsere Schüler:innen erfahrbar und zugänglich zu machen.',qs:['Wo können wir Schüler:innen mithilfe digitaler Tools an Entscheidungen beteiligen (z.B. Umfragen, Abstimmungen, digitale Pinnwände)?','Wie stellen wir sicher, dass auch Schüler:innen mit hohem Unterstützungsbedarf ihre Meinung einbringen können (z.B. Symbole, Fotos, einfache Abstimmungsformate)?','Wie können wir demokratische Prozesse im Schulalltag sichtbar machen und die Förderung demokratischer Teilhabe regelmäßig reflektieren?']},
{id:'EF2-5',cat:1,title:'Schüler:innen-orientierte Lernkultur',desc:'Unsere Lernkultur orientiert sich an den Stärken, Interessen und Bedürfnissen der Schüler:innen und macht Lernwege transparent – auch mithilfe digitaler Medien.',qs:['Wie erfassen wir systematisch Interessen, Stärken und Unterstützungsbedarfe unserer Schüler:innen – und wie fließen diese in digitale Lernangebote ein?','Wie können wir Lernziele, Lernwege und Erfolge für Schüler:innen verständlich visualisieren (z.B. digitale Portfolios, Symbolpläne, Lernpfade)?','Was brauchen wir, damit Schüler:innen sich selbst als aktive Gestalter:innen ihres Lernens erleben können?']},
{id:'EF2-6',cat:1,title:'Realisierung von Peer-Ansätzen',desc:'Wir nutzen digitale Medien, um Peer-Learning, gegenseitige Unterstützung und positive Vorbilder unter Schüler:innen zu fördern.',qs:['Wo gibt es bereits Ansatzpunkte für Peer-Learning (z.B. stärkere Schüler:innen unterstützen andere, Tandems) – auch digital?','Wie können wir Formate entwickeln, in denen Schüler:innen sich gegenseitig etwas erklären oder Lernprodukte zeigen (z.B. kurze Erklärvideos, gemeinsame Präsentationen)?','Wie sorgen wir dafür, dass Peer-Ansätze wertschätzend, strukturiert und für alle Beteiligten sicher gestaltet sind?']},
{id:'EF2-7',cat:1,title:'Etablieren einer Fehlerkultur',desc:'Fehler werden als natürlicher Teil des Lernens verstanden – digitale Medien unterstützen eine wertschätzende, angstfreie Fehlerkultur.',qs:['Wie sprechen wir im Kollegium und mit Schüler:innen über Fehler – welche Botschaften senden wir bewusst oder unbewusst?','Wie können digitale Tools helfen, Rückmeldungen so zu geben, dass sie ermutigen (z.B. individuelle Rückmeldungen, Lernstände sichtbar machen, ohne zu beschämen)?','Welche Rituale oder Vereinbarungen können helfen, mit Fehlern konstruktiv umzugehen (z.B. „Fehler des Tages“, gemeinsame Reflexionen)?']},
{id:'EF2-8*',cat:1,title:'Medienbildung und Schutz im Netz',desc:'Medienkompetenz wird schüler:innengerecht und alltagsnah vermittelt.',qs:['In welchen Klassenstufen greifen wir Themen wie „Bilder teilen“, „WhatsApp“, „Games“ oder „Fake News“ konkret auf?','Wie passen wir Inhalte und Materialien an die kognitiven Voraussetzungen unserer Lerngruppen an?','Wie können Eltern und Wohngruppen in die Medienbildung einbezogen werden?']},
{id:'EF2-9*',cat:1,title:'Übergänge und Berufsvorbereitung digital unterstützen',desc:'Digitale Medien unterstützen Berufsorientierung und den Übergang in Arbeit, Tagesstruktur oder weitere Bildung.',qs:['Wie nutzen wir digitale Tools für Berufsorientierung (z.B. Erkundungs-Apps, Portfolio, digitale Praktikumsdokumentation)?','Welche Kompetenzen in der digitalen Welt sind für unsere Abgänger:innen wirklich zentral (z.B. einfache Office-Nutzung, Messenger-Regeln, Online-Formulare)?','Wie binden wir Betriebe, Werkstätten und Unterstützungsdienste (z.B. Integrationsfachdienste) digital ein?']},
{id:'EF3-1',cat:2,title:'Stärkung der Beziehungsarbeit',desc:'Digitale Medien werden so eingesetzt, dass sie die Beziehungsarbeit zwischen Lehrkräften, weiteren Professionen und Schüler:innen unterstützen – nicht ersetzen.',qs:['In welchen Situationen helfen digitale Medien, Beziehung zu stärken (z.B. gemeinsames Anschauen von digitalen Schüler:innen-Produkten, individuelle Rückmeldungen, UK)?','Wo besteht die Gefahr, dass der Einsatz von Technik die direkte Beziehung eher schwächt – und wie können wir das vermeiden?','Wie können wir digitale Routinen (z.B. Morgenkreis mit digitalen Symbolen, gemeinsame Medienprojekte) nutzen, um Zugehörigkeit und Vertrauen zu stärken?']},
{id:'EF3-2',cat:2,title:'Differenzierung und Individualisierung erleichtern (Diklusion)',desc:'Digitale Tools helfen, Lernangebote auf sehr unterschiedliche Leistungsstände zuzuschneiden.',qs:['Welche Apps/Plattformen nutzen wir zur Anpassung von Aufgaben (z.B. Vorlesefunktionen, Bildunterstützung, anpassbare Schwierigkeitsgrade)?','Wie können wir Lernstände sichtbar machen, ohne Schüler:innen zu beschämen (z.B. individuelle Lernpläne auf dem Tablet)?','Wo können digitale Tools Lehrkräfte entlasten, ohne sie zu ersetzen?']},
{id:'EF3-3',cat:2,title:'Umfassende Kompetenzorientierung',desc:'Wir planen Unterricht und Förderung so, dass fachliche, personale, soziale und digitale Kompetenzen gemeinsam in den Blick genommen werden.',qs:['Welche fachlichen und überfachlichen Kompetenzen (z.B. Selbstständigkeit, Problemlösen, Kommunikation) sollen unsere Schüler:innen im digitalen Kontext besonders entwickeln?','Wie können wir Aufgaben gestalten, die mehr als nur Bedienkompetenz fördern (z.B. Planen, Entscheiden, Reflektieren, Zusammenarbeiten)?','Wie machen wir Kompetenzentwicklung für Schüler:innen, Eltern und Kollegium sichtbar (z.B. Kompetenzraster, Lernlandkarten)?']},
{id:'EF3-4',cat:2,title:'Erweiterte Lernaufgaben und Öffnung von Lernarrangements',desc:'Wir nutzen digitale Medien, um komplexere, offene und lebensweltnahe Lernaufgaben zu ermöglichen, die Kooperation, Kreativität und Selbstständigkeit fördern.',qs:['Wo setzen wir bisher eher geschlossene Aufgabenformate ein – und wo könnten wir diese durch offenere, projektorientierte Aufgaben ergänzen?','Wie können digitale Medien helfen, reale Fragestellungen aus dem Alltag unserer Schüler:innen in den Unterricht zu holen (z.B. Foto-Projekte, Audio-Interviews, Erkundungen)?','Welche Unterstützung brauchen Lehrkräfte, um solche erweiterten Lernarrangements zu planen, umzusetzen und zu reflektieren?']},
{id:'EF3-5',cat:2,title:'Förderung von 4K als Zukunftskompetenzen',desc:'Wir stärken Kommunikation, Kollaboration, Kreativität und Kritisches Denken (4K) gezielt durch den Einsatz digitaler Medien – angepasst an die Möglichkeiten unserer Schüler:innen.',qs:['Wo gibt es bei uns bereits Beispiele, bei denen Schüler:innen gemeinsam mit digitalen Medien arbeiten, kreativ werden oder Probleme lösen?','Wie können wir Aufgaben so gestalten, dass mindestens ein Element der 4K bewusst angesprochen wird (z.B. gemeinsame Planung, kreative Produkte, Reflexion)?','Wie passen wir 4K-Anforderungen an unterschiedliche Lernvoraussetzungen an, damit niemand überfordert wird?']},
{id:'EF3-6',cat:2,title:'Feedback und Partizipation als Lernprozesselemente',desc:'Feedback wird als kontinuierlicher Bestandteil des Lernens verstanden – digitale Medien eröffnen neue Formen der Rückmeldung und Beteiligung.',qs:['Wie geben wir unseren Schüler:innen aktuell Rückmeldung – und wie könnten digitale Werkzeuge (z.B. Audios, Tools, Symbole) dies unterstützen?','Wie können wir Schüler:innen an der Bewertung ihrer Lernprozesse beteiligen (z.B. Selbst- und Peer-Feedback in einfacher Form)?','Welche Formen von Feedback sind für unsere Schüler:innen besonders motivierend und verständlich – und wie können wir diese verstetigen?']},
{id:'EF3-7',cat:2,title:'Alternative Leistungsüberprüfungen',desc:'Wir nutzen alternative Leistungsüberprüfungen, in denen Schüler:innen ihre Kompetenzen auch mit digitalen Produkten zeigen können – über klassische Tests hinaus.',qs:['In welchen Bereichen könnten alternative Leistungsnachweise (z.B. Präsentationen, Erklärvideos, digitale Portfolios, Fotodokumentationen) sinnvoll sein?','Wie können wir Leistungsanforderungen transparent und verständlich machen (z.B. mit Symbolen, Beispielen, Kriterien in einfacher Sprache)?','Welche Rahmenbedingungen (Absprachen im Kollegium, Vorgaben, Dokumentation) brauchen wir, um alternative Leistungsüberprüfungen verlässlich umzusetzen?']},
{id:'EF3-8',cat:2,title:'Nutzung zeitgemäßer Bildungsmedien',desc:'Wir wählen digitale Bildungsmedien bewusst aus, erproben sie kritisch und passen sie an die Bedürfnisse unserer Schüler:innen an.',qs:['Nach welchen Kriterien wählen wir Bildungsmedien (Apps, Lernsoftware, Plattformen) aus – und wie dokumentieren wir unsere Erfahrungen?','Welche Bildungsmedien nutzen wir regelmäßig – und wo wünschen wir uns Alternativen, weil sie z.B. nicht passgenau sind?','Wie können wir unser Kollegium über geeignete Medien informieren (z.B. App-Sammlungen, kurze Vorstellungsrunden, interne Fortbildungen)?']},
{id:'EF3-9',cat:2,title:'Lernprozessbezogene Technologieentwicklung',desc:'Wir beobachten technologische Entwicklungen (z.B. neue Geräte, Apps, KI) und prüfen gemeinsam, welche davon für unsere Lernprozesse wirklich hilfreich sind.',qs:['Wie behalten wir neue Entwicklungen im Blick, ohne uns von Trends treiben zu lassen?','Welche Kriterien helfen uns zu entscheiden, ob eine neue Technologie für unsere Förderschule sinnvoll ist (z.B. Barrierefreiheit, Bedienbarkeit, Datenschutz, pädagogischer Mehrwert)?','Wie können wir Erprobungsphasen (Pilotprojekte) so gestalten, dass Erfahrungen systematisch ausgewertet und ins Kollegium zurückgespielt werden?']},
{id:'EF3-10*',cat:2,title:'Analog und digital sinnvoll verzahnen',desc:'Digitalisierung ergänzt bewährte Förder- und Unterrichtsformen, ersetzt sie aber nicht vollständig.',qs:['Bei welchen (Förder-)Bereichen (z.B. Lesen, Schreiben, Rechnen, Motorik, Kommunikation, soziales Lernen) bringen digitale Medien einen echten Mehrwert?','Wo sind analoge Methoden (z.B. Realgegenstände, Bewegung, Rollenspiele) weiterhin unverzichtbar?','Wie können wir beides bewusst kombinieren, statt einfach nur „digitale Arbeitsblätter“ einzusetzen (--> SAMR-Modell)?']},
{id:'EF3-11*',cat:2,title:'Kommunikation (und Lesekultur) digital stärken',desc:'Digitale Medien werden gezielt zur Kommunikationsförderung eingesetzt (z.B. Symbolapps, Sprachausgabe, Leseförderung).',qs:['Welche Schüler:innen benötigen dauerhaft oder phasenweise Unterstützung (z.B. Vorlesefunktion, Unterstützte Kommunikation)?','Welche digitalen Lösungen nutzen wir bereits, welche fehlen uns?','Wie stellen wir sicher, dass alle beteiligten Personen (Lehrkräfte, Schulbegleitungen, Therapeut:innen, Eltern) mit den gewählten Systemen arbeiten können?']},
{id:'EF3-12*',cat:2,title:'Struktur, Sicherheit und Orientierung – auch digital',desc:'Digitale Settings brauchen für unsere Schüler:innen klare Strukturen, Rituale und verlässliche Abläufe.',qs:['Wie bilden wir bekannte Strukturen (z.B. Tagespläne, Wochenpläne, Ampelsysteme) digital ab?','Was tun wir, um Überreizung und Ablenkung durch Geräte zu verhindern (z.B. App-Begrenzungen, feste Nutzungszeiten)?','Welche einfachen Regeln (in leichter Sprache, mit Symbolen) brauchen wir für die Nutzung von Tablets/PCs?']},
{id:'EF3-13*',cat:2,title:'Lernorte verbinden – Präsenz, Distanz, Außerschulisches',desc:'Digitale Medien erleichtern die Verbindung von Schule, Zuhause, Therapie und außerschulischen Lernorten.',qs:['Wie können wir Präsenz und Distanz so verzahnen, dass ggf. Unterricht auf Distanz schnell und einfach möglich ist?','Welche (digitalen) außerschulischen Lernorte bieten einen Mehrwert für unsere Schüler:innen? Wie können diese verstetigt werden?','Wo könnten wir digitale Angebote von Museen, Werkstätten, Beratungsstellen o.Ä. in unseren Unterricht integrieren?']},
{id:'EF4-1',cat:3,title:'Einbezug von Expertisen und Perspektiven',desc:'Die gesamte Schulgemeinschaft wird in die Entwicklung des Lernens in der digitalen Welt einbezogen – mit ihren jeweiligen Perspektiven und Expertisen.',qs:['Welche unterschiedlichen Perspektiven (Schüler:innen, Eltern, Schulbegleitungen, Therapeut:innen, Schulsozialarbeit, Schulträger) berücksichtigen wir bereits systematisch?','Wo fehlen uns bisher Stimmen – und wie können wir diese gezielt einbeziehen (z.B. Befragungen, Runde Tische, Workshops)?','Wie gewährleisten wir, dass Beteiligung nicht nur punktuell, sondern als kontinuierlicher Prozess angelegt ist?']},
{id:'EF4-2',cat:3,title:'Erweiterte Haltungen und Mindsets',desc:'Wir entwickeln Haltungen weiter, die Offenheit, Lernbereitschaft und Reflexion im Umgang mit digitalem Wandel fördern – bei gleichzeitigem Blick auf die Bedürfnisse unserer Schüler:innen.',qs:['Wie gehen wir im Kollegium mit Unsicherheiten, Skepsis oder Überforderung im Zusammenhang mit Digitalisierung um?','Welche gemeinsamen Grundüberzeugungen zum Lernen in der digitalen Welt möchten wir (weiter)entwickeln?','Wie schaffen wir Räume für Austausch und Reflexion, in denen Haltungen angesprochen und weiterentwickelt werden können?']},
{id:'EF4-3',cat:3,title:'Zukunftsfähiges Rollenverständnis',desc:'Die Rolle der Lehrkraft verschiebt sich stärker hin zu Lernbegleitung, Strukturgebung und individueller Unterstützung – gerade in der Förderschule.',qs:['Wie verändert sich meine Rolle als Lehrkraft im Zeitalter der Digitalität?','Wo fällt es leicht, Verantwortung an die Lernenden abzugeben – wo schwer?','Welche Unterstützung braucht es, um sich in dieser neuen Rolle sicher zu fühlen?']},
{id:'EF4-4',cat:3,title:'passgenaue Fort- und Weiterbildungen',desc:'Fortbildungen orientieren sich an unseren konkreten Unterrichts- und Förderfragen, nicht nur an Technik.',qs:['Welche 2–3 Themen sind für unsere Schule in den nächsten 12 Monaten wirklich zentral (z.B. UK-Apps, einfache Videoproduktion, Lernplattformen)?','Welche Formate passen zu uns (schulinterne Fortbildung, Tandems, Hospitationen, Mikro-Fortbildungen im Kollegium)?','Wie sichern wir, dass Fortbildungswissen (einzelner) im Kollegium geteilt und verstetigt wird?']},
{id:'EF4-5',cat:3,title:'Aktive Beteiligung und Verantwortungsübernahme',desc:'Lehrkräfte und weitere Professionen übernehmen aktiv Verantwortung für die Gestaltung des Lernens in der digitalen Welt.',qs:['In welchen Bereichen übernehmen Kolleg:innen bereits Verantwortung (z.B. für Medientechnik, Fortbildung, Konzeptarbeit)?','Wie können wir Verantwortlichkeiten klarer und transparenter machen, ohne Einzelne zu überlasten?','Welche Unterstützung (Zeit, Anerkennung, Qualifizierung) brauchen Kolleg:innen, um Verantwortung gut wahrnehmen zu können?']},
{id:'EF4-6',cat:3,title:'Mitgestaltung von digitalisierungsbezogenen Innovationen',desc:'Wir gestalten Innovationen im Bereich der Digitalisierung nicht nur nach Vorgaben, sondern entwickeln eigene, schulische Lösungen weiter.',qs:['Wo haben wir bereits selbst Ideen und Projekte entwickelt, statt nur äußere Anforderungen umzusetzen?','Wie können wir Innovationen erproben, evaluieren und bei Erfolg in die Regelpraxis überführen?','Welche Strukturen (z.B. Steuergruppe, Projektteams, Erprobungsphasen) helfen uns, Innovationen gemeinsam zu gestalten?']},
{id:'EF4-7',cat:3,title:'Entwicklung und Realisierung neuer Arbeitsformen',desc:'Digitale Werkzeuge ermöglichen neue Formen der Zusammenarbeit und Arbeitsorganisation im Kollegium und mit weiteren Professionen.',qs:['Welche digitalen Arbeitsformen nutzen wir bereits (z.B. gemeinsame Dokumente, digitale Konferenzen, Austauschplattformen)?','Wo könnten wir unsere Zusammenarbeit durch digitale Tools entlasten oder transparenter machen?','Welche Absprachen brauchen wir, damit digitale Arbeitsformen überschaubar bleiben und niemand den Überblick verliert?']},
{id:'EF4-8*',cat:3,title:'Kollegiale Zusammenarbeit im Digital-Team',desc:'Ein kleines, arbeitsfähiges Team (z.B. Medien-/Digitalisierungsteam) koordiniert Prozesse, ist aber nicht „zuständig für alles“.',qs:['Gibt es bei uns ein klares Team (und NICHT nur eine Person) mit Auftrag (z.B. Digitalisierungsbeauftragte:r, Admins)?','Welche Aufgaben liegen dort (z.B. Koordination, Vernetzung, Sichtung von Materialien) – und welche bleiben bewusst in der Gesamtverantwortung des Kollegiums?','Wie sichern wir Zeitressourcen und Entlastung für dieses Team?']},
{id:'EF4-9*',cat:3,title:'Zusammenarbeit mit Schulträger, IT und externen Partnern',desc:'Technische Infrastruktur, Support und pädagogische Ziele müssen zusammen gedacht werden – in engem Kontakt mit Schulträger und externen Partnern.',qs:['Wie gut funktioniert aktuell unser Austausch mit dem Schulträger und der Schul-IT (z.B. Support, Geräte, WLAN, Wartung, Lizenzen)?','Wo brauchen wir klare Absprachen (z.B. feste Ansprechpartner, Reaktionszeiten bei Störungen, Zuständigkeiten)?','Welche externen Partner (Medienberatende, Medienzentren, QUA-LiS-Angebote, außerschulische Lernorte) können uns gezielt unterstützen?']},
{id:'EF4-10*',cat:3,title:'Datenschutz und Schutzkonzepte im Blick behalten',desc:'Datenschutz, Kinder- und Jugendschutz sowie Schutzkonzepte für besonders vulnerable Schüler:innen werden bei allen digitalen Entscheidungen mitgedacht.',qs:['Welche digitalen Tools sind von Land/Schulträger freigegeben – und welche nutzen wir zusätzlich (werden bei diesen alle Datenschutzaspekte eingehalten)?','Wie informieren und beteiligen wir Eltern über Datenverarbeitung, Datenschutz und Mediennutzung (verständliche Infos, ggf. Leichte Sprache)?','Wie reagieren wir, wenn problematische Vorfälle auftreten (z.B. Bildversand, Beleidigungen im Chat) – gibt es klare Abläufe?']},
{id:'EF5-1*',cat:4,title:'Einsatz digitaler Lehr-Lernsoftware',desc:'Wir setzen Lehr-Lern-Software bewusst, zielgerichtet und datenschutzkonform ein, um Lern- und Förderprozesse zu unterstützen.',qs:['Welche Lehr-Lern-Software nutzen wir derzeit regelmäßig – und mit welchem pädagogischen Ziel?','Wie prüfen wir neue Software-Angebote auf Passung zu unseren Schüler:innen (z.B. Barrierefreiheit, Sprache, Bedienbarkeit)?','Wie sichern wir, dass alle Beteiligten (Lehrkräfte, Schüler:innen, ggf. Eltern) die eingesetzte Software kennen und anwenden können?']},
{id:'EF5-2*',cat:4,title:'Effektiver Einsatz schulischer Lehr-Lerngeräte',desc:'Unsere Geräte (Tablets, Notebooks, stationäre PCs, UK-Geräte, …) sind didaktisch begründet ausgewählt, gut zugänglich und verlässlich nutzbar.',qs:['Welche Geräte stehen uns zur Verfügung – und wie werden diese aktuell eingesetzt?','Wo erleben wir Engpässe, Stolpersteine oder technische Hürden im Alltag? Wie können diese gelöst werden, um alle Geräte gewinnbringend einsetzen zu können?','Welche Prioritäten setzen wir bei zukünftigen Anschaffungen, um Lernen und Teilhabe unserer Schüler:innen bestmöglich zu unterstützen?']},
{id:'EF5-3*',cat:4,title:'Schaffung von „Digital Making Places“',desc:'Wir schaffen Orte und Gelegenheiten, an denen Schüler:innen mit digitalen Medien kreativ gestalten, ausprobieren und experimentieren können.',qs:['Wo gibt es bereits Räume oder Gelegenheiten für kreatives Arbeiten mit digitalen Medien (z.B. Medienraum, Projektwochen, AGs)?','Welche Formen des „Making“ (z.B. Foto/Video-, Audio-Produktion, 3D-Druck, Robotik) passen zu unseren Schüler:innen?','Was brauchen wir (Ausstattung, Zeit, Qualifizierung), um solche Making-Orte nachhaltig zu etablieren?']},
{id:'EF5-4*',cat:4,title:'Einbezug von Coding und Robotik in den Unterricht',desc:'Wir nutzen Coding und Robotik – angepasst an unsere Förderschule – zur Förderung von Problemlösefähigkeit, Feinmotorik und Motivation.',qs:['Wo haben wir bereits Erfahrungen mit Coding- oder Robotik-Angeboten gesammelt?','Welche niedrigschwelligen Angebote (z.B. Roboter, einfache Programmier-Apps) wären für unsere Schüler:innen geeignet?','Wie können wir solche Angebote in unseren Unterricht oder in Projekte integrieren?']},
{id:'EF5-5*',cat:4,title:'Digitalisierung schulischer Verwaltungsaufgaben',desc:'Digitale Verwaltungsprozesse (z.B. Vertretungspläne, Kommunikation, Dokumentation) werden so gestaltet, dass sie den pädagogischen Auftrag unterstützen und nicht zusätzlich belasten.',qs:['Welche digitalen Verwaltungsprozesse nutzen wir bereits – was funktioniert gut, was eher nicht?','Wie können wir Abläufe vereinfachen oder bündeln, damit mehr Zeit für pädagogische Arbeit bleibt?','Welche Absprachen, Tools etc. benötigen wir im Kollegium (z.B. Erreichbarkeitsregeln, Kommunikationswege, -Apps), um Entlastung zu erreichen?']},
{id:'EF5-6*',cat:4,title:'Lehren und Lernen mit und über KI',desc:'Wir betrachten den Einsatz von KI als Chance und treffen bewusste Entscheidungen über den Einsatz im schulischen Kontext.',qs:['Wo könnten KI-Anwendungen unsere Arbeit unterstützen ohne die pädagogische Verantwortung abzugeben (z.B. Materialideen, Visualisierungen, Sprachunterstützung)?','Welche Vereinbarungen brauchen wir zu Transparenz, Datenschutz und Altersangemessenheit beim Umgang mit KI?','Wie sollte ein KI-Leitfaden für Lehrkräfte und Schüler:innen an unserer Schule aussehen?']}
];
const KEY='beratungstool-v5';let state=load()||{screen:'start',cat:0,index:0,assignments:{},priority:[],excluded:[],quick:'',roadmap:''};
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function saveNotes(){state.quick=document.getElementById('quick')?.value??state.quick;state.roadmap=document.getElementById('roadmap')?.value??state.roadmap;persist()}function setScreen(screen){saveNotes();state.screen=screen;render()}function reset(){localStorage.removeItem(KEY);state={screen:'start',cat:0,index:0,assignments:{},priority:[],excluded:[],quick:'',roadmap:''};render()}function cardList(){return cards.filter(c=>c.cat===state.cat)}function current(){return cardList()[state.index]}
function render(){if(state.screen==='start')startView();else if(state.screen==='categories')categoriesView();else if(state.screen==='swipe')swipeView();else if(state.screen==='results')resultsView();else notesView();document.getElementById('sessionStatus').textContent=Object.keys(state.assignments).length?`${Object.keys(state.assignments).length}/${cards.length} Karten sortiert`:'Lokale Sitzung'}
function startView(){document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Moderierter Workshop</div><h1 tabindex="-1">Digitale Transformation an Förderschulen gemeinsam gestalten</h1><p class="hero-copy">Dieses Beratungstool unterstützt Medienberatende dabei, Themen der digitalen Schulentwicklung strukturiert zu besprechen und gemeinsam mit einer Schule Schwerpunkte zu setzen.</p><p class="hero-copy">Sie ordnen Themenkarten zwei Bereichen zu, gewichten die Arbeitsschwerpunkte und halten konkrete nächste Schritte fest.</p><div class="notice"><strong>Datenschutz-Hinweis</strong>Ihre Eingaben bleiben in dieser Sitzung auf diesem Gerät. Es gibt keinen Login und keine automatische Übertragung. Nutzen Sie den Druckdialog, um die Ergebnisse als PDF zu sichern.</div><div class="actions"><button id="start" class="button" type="button">Beratung starten</button><button id="continueBtn" class="button secondary" type="button" ${Object.keys(state.assignments).length?'':'disabled'}>Sitzung fortsetzen</button></div></section>`;document.getElementById('start').onclick=()=>setScreen('categories');document.getElementById('continueBtn').onclick=()=>setScreen(Object.keys(state.assignments).length<cards.length?'categories':'results');document.querySelector('#app h1')?.focus()}
function categoriesView(){document.getElementById('app').innerHTML=`<div class="eyebrow">Schritt 1 von 4</div><h1 tabindex="-1">Entwicklungsbereich auswählen</h1><p class="muted">Wählen Sie einen Bereich. Die Karten werden nacheinander angezeigt; bereits sortierte Karten bleiben erhalten.</p><div class="grid">${categories.map((c,i)=>{const n=cards.filter(x=>x.cat===i).length,done=cards.filter(x=>x.cat===i&&state.assignments[x.id]).length;return `<button class="panel category" data-cat="${i}" type="button"><span class="number">0${i+1}</span><h3>${esc(c)}</h3><span class="muted">${done===n?'Abgeschlossen ✓':`${done} von ${n} Karten sortiert`}</span></button>`}).join('')}</div><div class="footer no-print"><button class="button secondary" id="home" type="button">Startseite</button><div class="actions"><button class="button secondary" id="results" type="button">Ergebnisübersicht</button><button class="button" id="all" type="button" ${Object.keys(state.assignments).length===cards.length?'disabled':''}>Alle offenen Karten starten</button></div></div>`;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=+b.dataset.cat;const list=cardList();const idx=list.findIndex(x=>!state.assignments[x.id]);state.index=idx!==-1?idx:Math.max(0,list.length-1);setScreen('swipe')});document.getElementById('home').onclick=()=>setScreen('start');document.getElementById('results').onclick=()=>setScreen('results');document.getElementById('all').onclick=()=>{for(let cat=0;cat<categories.length;cat++){const list=cards.filter(x=>x.cat===cat);const idx=list.findIndex(x=>!state.assignments[x.id]);if(idx!==-1){state.cat=cat;state.index=idx;setScreen('swipe');return}}setScreen('results')};document.querySelector('#app h1')?.focus()}
function decide(dir){const c=current();if(!c)return;const prev=state.assignments[c.id];state.assignments[c.id]=dir;if(prev!==dir){state.priority=state.priority.filter(id=>id!==c.id);state.excluded=state.excluded.filter(id=>id!==c.id)}persist();const list=cardList(),el=document.getElementById('swipeCard');el.classList.add(dir==='left'?'fly-left':'fly-right');setTimeout(()=>{if(state.index<list.length-1)state.index++;else state.screen='categories';render();document.getElementById('swipeCard')?.focus()},220)}
function swipeView(){const list=cardList(),c=current();if(!c){state.screen='categories';return render()}const done=Object.keys(state.assignments).filter(id=>cards.find(x=>x.id===id)?.cat===state.cat).length;document.getElementById('app').innerHTML=`<div class="eyebrow">Schritt 2 von 4 · ${esc(categories[state.cat])}</div><h1>Themenkarten sortieren</h1><p class="muted">Karte ${state.index+1} von ${list.length} · ${done} bereits sortiert</p><div class="panel notice"><strong>So funktioniert das Sortieren</strong><span>Wischen oder ziehen Sie nach links für „bereits erarbeitet / aktuell nicht relevant“ und nach rechts für „aktueller / zukünftiger Arbeitsschwerpunkt“. Tastatur: ← oder →.</span></div><div class="progress" aria-label="Fortschritt"><span style="width:${((state.index+1)/list.length)*100}%"></span></div><section class="swipe-stage"><div id="swipeCard" class="panel swipe-card" tabindex="0" role="group" aria-label="Themenkarte"><div class="swipe-label left">BEREITS ERARBEITET</div><div class="swipe-label right">ARBEITSSCHWERPUNKT</div><div><span class="code">${esc(c.id)}</span><h2>${esc(c.title)}</h2><p>${esc(c.desc)}</p><details class="questions"><summary>Impulsfragen anzeigen</summary><ul>${c.qs.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></details></div><div class="swipe-help"><div class="help left">← Bereits erarbeitet<br><small>oder nicht relevant</small></div><div class="help right">Aktueller / zukünftiger<br>Arbeitsschwerpunkt →</div></div></div></section><div class="footer no-print"><button class="button secondary" id="home" type="button">Startseite</button><button class="button secondary" id="back" type="button">Zurück</button><button class="button secondary" id="cats" type="button">Bereiche</button><button class="button" id="skip" type="button">Später entscheiden</button></div>`;const el=document.getElementById('swipeCard');let sx=0,dx=0,drag=false;function move(x){dx=x-sx;el.style.transform=`translateX(${dx}px) rotate(${dx*.05}deg)`;el.classList.toggle('left',dx<-35);el.classList.toggle('right',dx>35)}function end(){if(!drag)return;drag=false;el.classList.remove('dragging','left','right');el.style.transform='';if(Math.abs(dx)>100)decide(dx>0?'right':'left');else dx=0}el.addEventListener('pointerdown',e=>{if(e.target.closest('details'))return;drag=true;sx=e.clientX;el.setPointerCapture(e.pointerId);el.classList.add('dragging')});el.addEventListener('pointermove',e=>{if(drag)move(e.clientX)});el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();decide('left')}if(e.key==='ArrowRight'){e.preventDefault();decide('right')}});document.getElementById('home').onclick=()=>setScreen('start');document.getElementById('back').onclick=()=>{if(state.index>0){state.index--;setScreen('swipe')}else setScreen('categories')};document.getElementById('cats').onclick=()=>setScreen('categories');document.getElementById('skip').onclick=()=>{if(state.index<list.length-1){state.index++;render()}else setScreen('categories')};el.focus()}
function grouped(){return categories.map((label,cat)=>({label,items:cards.filter(c=>c.cat===cat&&state.assignments[c.id])})).filter(g=>g.items.length)}function item(c){const dir=state.assignments[c.id];const cls=dir==='right'?'dir-right':'dir-left';const label=dir==='right'?'Arbeitsschwerpunkt':'Bereits erarbeitet';return `<div class="result ${cls}"><span class="dir-badge ${cls}">${label}</span><span class="code">${esc(c.id)}</span> ${esc(c.title)}<details><summary>Impulsfragen anzeigen</summary><ul>${c.qs.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></details></div>`}function focus(){return cards.filter(c=>state.assignments[c.id]==='right')}function priorityCard(c,i,total,zone){return `<div class="drag-card" draggable="true" data-drag="${c.id}" data-zone="${zone}"><span class="grip" aria-hidden="true">⠿</span><span class="rank">${i+1}</span><div class="card-main"><strong>${esc(c.title)}</strong><br><small class="muted">${esc(c.id)}</small></div><div class="reorder-btns no-print"><button type="button" class="icon-btn" data-move="up" data-id="${c.id}" data-zone="${zone}" ${i===0?'disabled':''} aria-label="${esc(c.title)} nach oben verschieben">↑</button><button type="button" class="icon-btn" data-move="down" data-id="${c.id}" data-zone="${zone}" ${i===total-1?'disabled':''} aria-label="${esc(c.title)} nach unten verschieben">↓</button></div></div>`}
function priorityBoard(){let inc=state.priority.map(id=>cards.find(c=>c.id===id)).filter(Boolean),exc=state.excluded.map(id=>cards.find(c=>c.id===id)).filter(Boolean),available=focus().filter(c=>!state.priority.includes(c.id)&&!state.excluded.includes(c.id));inc=[...inc,...available];state.priority=inc.map(c=>c.id);persist();return `<div class="priority-layout"><div class="dropzone" data-zone="include"><h3>Schwerpunkte für Quick Wins und Fahrplan</h3><p class="muted">Oben = höhere Gewichtung. Karte per Griff (⠿) ziehen oder mit ↑/↓ verschieben – beim Ziehen zeigt eine gestrichelte Markierung die Zielposition.</p>${inc.length?inc.map((cd,i)=>priorityCard(cd,i,inc.length,'include')).join(''):'<p class="muted">Noch keine Schwerpunkte.</p>'}</div><div class="dropzone exclude" data-zone="exclude"><h3>Nicht berücksichtigen</h3><p class="muted">Hierher ziehen, wenn ein Thema vorerst nicht weiterbearbeitet wird.</p>${exc.length?exc.map((cd,i)=>priorityCard(cd,i,exc.length,'exclude')).join(''):'<p class="muted">Noch keine ausgeschlossenen Themen.</p>'}</div></div>`}
function getDragAfterElement(zone,y){const els=[...zone.querySelectorAll('.drag-card:not(.dragging)')];return els.reduce((closest,el)=>{const box=el.getBoundingClientRect();const offset=y-box.top-box.height/2;if(offset<0&&offset>closest.offset)return{offset,element:el};return closest},{offset:Number.NEGATIVE_INFINITY,element:null}).element}
function setupDrag(){
document.querySelectorAll('[data-drag]').forEach(el=>{
el.ondragstart=e=>{e.dataTransfer.setData('text/plain',el.dataset.drag);e.dataTransfer.effectAllowed='move';requestAnimationFrame(()=>el.classList.add('dragging'))};
el.ondragend=()=>{document.querySelectorAll('.drag-card').forEach(x=>x.classList.remove('dragging'));document.querySelectorAll('.drag-placeholder').forEach(p=>p.remove());document.querySelectorAll('.dropzone').forEach(z=>z.classList.remove('over'))}
});
document.querySelectorAll('.dropzone').forEach(z=>{
z.ondragover=e=>{e.preventDefault();z.classList.add('over');let ph=z.querySelector('.drag-placeholder');if(!ph){ph=document.createElement('div');ph.className='drag-placeholder'}const after=getDragAfterElement(z,e.clientY);if(after==null)z.appendChild(ph);else z.insertBefore(ph,after)};
z.ondragleave=e=>{if(!z.contains(e.relatedTarget)){z.classList.remove('over');z.querySelector('.drag-placeholder')?.remove()}};
z.ondrop=e=>{e.preventDefault();z.classList.remove('over');const id=e.dataTransfer.getData('text/plain');const ph=z.querySelector('.drag-placeholder');const children=[...z.children];let idx=children.filter(x=>x.classList?.contains('drag-card')&&x.dataset.drag!==id).length;if(ph){idx=0;for(const child of children){if(child===ph)break;if(child.classList?.contains('drag-card')&&child.dataset.drag!==id)idx++}}ph?.remove();state.priority=state.priority.filter(x=>x!==id);state.excluded=state.excluded.filter(x=>x!==id);const arr=z.dataset.zone==='include'?state.priority:state.excluded;arr.splice(idx,0,id);persist();render()}
});
document.querySelectorAll('[data-move]').forEach(btn=>btn.onclick=()=>{
const id=btn.dataset.id,zone=btn.dataset.zone,dir=btn.dataset.move;
const arr=zone==='include'?state.priority:state.excluded;
const idx=arr.indexOf(id);const swap=dir==='up'?idx-1:idx+1;
if(idx===-1||swap<0||swap>=arr.length)return;
[arr[idx],arr[swap]]=[arr[swap],arr[idx]];persist();render()
})
}
function resultsView(){const sorted=grouped();document.getElementById('app').innerHTML=`<div class="eyebrow">Schritt 3 von 4</div><h1 tabindex="-1">Ergebnisübersicht</h1><p class="muted">${Object.keys(state.assignments).length} von ${cards.length} Karten sortiert. Die Detailübersicht kann bei Bedarf aufgeklappt werden.</p><section class="panel highlight"><h2>Schwerpunkte gewichten</h2><p class="muted">Die Reihenfolge bestimmt die Priorität für die nächsten Schritte.</p>${priorityBoard()}</section><details class="sorted-cards"><summary>Sortierte Karten ansehen <span class="count">${Object.keys(state.assignments).length}</span></summary><div class="sorted-cards-content"><p class="muted" style="margin-top:14px"><span class="dir-badge dir-right">Arbeitsschwerpunkt</span> aktueller/zukünftiger Schwerpunkt &nbsp; <span class="dir-badge dir-left">Bereits erarbeitet</span> erledigt oder nicht relevant</p>${sorted.length?sorted.map(g=>`<section class="result-section"><h3>${esc(g.label)} <span class="count">${g.items.length}</span></h3>${g.items.map(item).join('')}</section>`).join(''):'<p class="muted">Noch keine Karten sortiert.</p>'}</div></details><div class="footer no-print"><button class="button secondary" id="step1" type="button">Zu Schritt 1</button><button class="button secondary" id="home" type="button">Startseite</button><button class="button" id="continueBtn" type="button">Quick Wins und Fahrplan</button></div>`;setupDrag();document.getElementById('step1').onclick=()=>setScreen('categories');document.getElementById('home').onclick=()=>setScreen('start');document.getElementById('continueBtn').onclick=()=>setScreen('notes');document.querySelector('#app h1')?.focus()}
function notesView(){const inc=state.priority.map(id=>cards.find(c=>c.id===id)).filter(Boolean),exc=state.excluded.map(id=>cards.find(c=>c.id===id)).filter(Boolean);document.getElementById('app').innerHTML=`<div class="eyebrow">Schritt 4 von 4</div><h1 tabindex="-1">Quick Wins und Fahrplan</h1><section class="panel"><h2>Gewichtete Arbeitsschwerpunkte</h2><p class="muted">Die Reihenfolge entspricht der Gewichtung aus der Ergebnisübersicht.</p>${inc.length?`<ol>${inc.map(c=>`<li><strong>${esc(c.title)}</strong><br><small class="muted">${esc(c.id)}</small><details><summary>Impulsfragen anzeigen</summary><ul>${c.qs.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></details></li>`).join('')}</ol>`:'<p class="muted">Keine Arbeitsschwerpunkte berücksichtigt.</p>'}${exc.length?`<h3>Nicht berücksichtigt</h3>${exc.map(c=>`<div class="result"><span class="code">${esc(c.id)}</span> ${esc(c.title)}</div>`).join('')}`:''}</section><div class="forms"><section class="panel textarea-wrap"><label for="quick">Quick Wins</label><p class="muted">Welche kleinen Schritte können kurzfristig umgesetzt werden?</p><textarea id="quick" placeholder="Beispiel: Bis zum nächsten Treffen einen datenschutzkonformen Tool-Test mit einer Lerngruppe durchführen.">${esc(state.quick)}</textarea></section><section class="panel textarea-wrap"><label for="roadmap">Fahrplan für die nächsten zwei Jahre</label><p class="muted">Welche drei bis fünf Schwerpunkte setzen wir – mit Verantwortlichen und Termin?</p><textarea id="roadmap" placeholder="Schwerpunkt 1 – Verantwortlich – Termin&#10;Schwerpunkt 2 – Verantwortlich – Termin">${esc(state.roadmap)}</textarea></section></div><div class="export-note">Der Export öffnet den Druckdialog Ihres Browsers. Wählen Sie dort „Als PDF speichern“.</div><div class="footer no-print"><button class="button secondary" id="home" type="button">Startseite</button><button class="button secondary" id="cats" type="button">Bereiche</button><button class="button secondary" id="results" type="button">Zur Ergebnisübersicht</button><button class="button" id="print" type="button">Drucken / PDF-Export</button></div>`;document.getElementById('home').onclick=()=>setScreen('start');document.getElementById('cats').onclick=()=>setScreen('categories');document.getElementById('results').onclick=()=>setScreen('results');document.getElementById('print').onclick=()=>{saveNotes();window.print()};document.querySelector('#app h1')?.focus()}
document.getElementById('resetTop').onclick=()=>{if(confirm('Die gesamte lokale Sitzung inkl. sortierter Karten, Priorisierung und Notizen (Quick Wins, Fahrplan) wirklich zurücksetzen?'))reset()};render();
</script>
